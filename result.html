<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>おすすめゲーム｜検索結果</title>

<style> * { box-sizing: border-box; } body { margin: 0; font-family: Arial, "Noto Sans JP", sans-serif; background: #0b1928; color: #e8f0f7; line-height: 1.6; } .page { display: flex; justify-content: center; align-items: flex-start; gap: 20px; max-width: 1500px; margin: 0 auto; } .side-ad { width: 160px; min-width: 160px; height: 600px; margin-top: 40px; } .main { width: min(900px, 100%); padding: 50px 0 80px; } h1 { text-align: center; font-size: 44px; margin: 0 0 15px; } .description { text-align: center; color: #b8c7d4; font-size: 20px; margin: 0 0 40px; } .result-card { background: #13283b; border: 1px solid #24445d; border-radius: 12px; padding: 25px; margin-bottom: 20px; } .result-card h2 { margin: 0 0 15px; font-size: 24px; } .info { background: #0d1e2e; border-radius: 8px; padding: 15px; margin-top: 10px; } .game-card { background: #0d1e2e; border: 1px solid #29475e; border-radius: 10px; padding: 18px; margin-top: 12px; } .game-card h3 { margin: 0 0 8px; font-size: 19px; } .game-card p { margin: 5px 0; color: #b8c7d4; } .score { font-weight: bold; margin: 10px 0; } .steam-link { display: inline-block; margin-top: 12px; padding: 10px 15px; background: #1b75b5; color: white; text-decoration: none; border-radius: 8px; } .steam-link:hover { background: #258ed0; } .back-button { display: block; width: min(500px, 100%); margin: 35px auto 0; padding: 16px; border: none; border-radius: 10px; background: #1b75b5; color: white; font-size: 17px; font-weight: bold; cursor: pointer; } .back-button:hover { background: #258ed0; } @media (max-width: 1150px) { .side-ad { display: none; } .page { width: 100%; } .main { width: min(900px, 92%); } } @media (max-width: 650px) { .main { padding-top: 35px; } h1 { font-size: 32px; } .description { font-size: 17px; } .result-card { padding: 20px; } } </style>

</head>

<body>

<div class="page">

<aside class="side-ad"></aside>

<main class="main">

<h1>おすすめSteamゲーム</h1>

<p class="description"> あなたにおすすめのゲームです。 </p>

<section class="result-card">

<h2>おすすめゲームTOP3</h2>

<div id="result"> 読み込み中... </div>

</section>

<button type="button" class="back-button" onclick="location.href='index.html'">

診断ページに戻る

</button>

</main>

<aside class="side-ad"></aside>

</div>

<script> "use strict"; const resultElement = document.getElementById("result"); const savedResult = localStorage.getItem("workerTestResult"); console.log( "workerTestResult:", savedResult ); if (savedResult === null) { resultElement.innerHTML = "<div class=\"info\">" + "検索データがありません。" + "<br>" + "診断ページからもう一度検索してください。" + "</div>"; } else { try { const result = JSON.parse(savedResult); console.log( "解析した結果:", result ); if (result.success !== true) { resultElement.innerHTML = "<div class=\"info\">" + "検索に失敗しました。" + "<br>" + (result.message || "") + "</div>"; } else { const games = Array.isArray(result.recommendations) ? result.recommendations : []; if (games.length === 0) { resultElement.innerHTML = "<div class=\"info\">" + "条件に合うおすすめゲームが" + "見つかりませんでした。" + "</div>"; } else { let html = ""; games.forEach(function(game, index) { const name = game.name || "ゲーム名不明"; const score = typeof game.score === "number" ? game.score : 0; const genres = Array.isArray(game.genres) ? game.genres.join("、") : "不明"; const price = game.price || "不明"; const appid = game.appid || ""; html += "<div class=\"game-card\">" + "<h3>" + (index + 1) + "位：" + name + "</h3>" + "<div class=\"score\">" + "相性スコア：" + score + "点" + "</div>" + "<p>" + "<strong>ジャンル：</strong>" + genres + "</p>" + "<p>" + "<strong>価格：</strong>" + price + "</p>" + "<p>" + "<strong>Steam App ID：</strong>" + (appid || "不明") + "</p>"; if (appid !== "") { html += "<a " + "class=\"steam-link\" " + "href=\"" + "https://store.steampowered.com/app/" + appid + "/\" " + "target=\"_blank\" " + "rel=\"noopener noreferrer\">" + "Steamでゲームを見る" + "</a>"; } html += "</div>"; }); resultElement.innerHTML = html; } } } catch (error) { console.error( "結果表示エラー:", error ); resultElement.innerHTML = "<div class=\"info\">" + "結果データの読み込みに失敗しました。" + "<br><br>" + error.message + "</div>"; } } </script>

</body>

</html>
